org.gradle.parallel=true
org.gradle.caching=true

org.gradle.daemon=true
# Disabled: configure-on-demand is deprecated (removed in Gradle 10) and, under Gradle 9, causes
# ':stroom-index:lucene553-shaded' to be configured lazily inside another project's afterEvaluate phase,
# where the shadow plugin's own afterEvaluate call is illegal ("cannot be executed in the current context").
org.gradle.configureondemand=false
org.gradle.jvmargs=-Xmx5500m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
