<!--
  Sandboxed host page for the Graph DB Data tab's Cytoscape graph view. Loaded in an iframe by
  GraphFrame and driven over the same postMessage protocol as vis.html (see graph.js).

  The graph library is self-hosted (no CDN, for air-gapped deployments) and vendored under
  script/cytoscape/:
    - cytoscape.min.js         (required; MIT; v3.34.0)
    - cytoscape-fcose.js       (optional layout extension; MIT - not currently vendored, so graph.js
                                falls back to the built-in 'cose' layout). To enable fcose, drop the
                                file in and add its <script> tag below.
  If cytoscape.min.js is absent graph.js shows an installation hint instead of rendering.
-->
<html>
<head>
    <meta charset="UTF-8"/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent;
            font-family: sans-serif;
        }

        #cy {
            width: 100%;
            height: 100%;
            display: block;
        }

        .graph-hint {
            padding: 16px;
            font-size: 13px;
            color: #666666;
            line-height: 1.5;
        }
    </style>
    <script type="text/javascript" src="script/cytoscape/cytoscape.min.js"></script>
    <script type="text/javascript" src="graph.js"></script>
</head>
<body>
<div id="cy"></div>
</body>
</html>
